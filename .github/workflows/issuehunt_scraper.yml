name: IssueHunt Scraper Cron

on:
  schedule:
    - cron: '30 * * * *' # Runs at minute 30 past every hour
  workflow_dispatch:

jobs:
  scrape-issuehunt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run IssueHunt Scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DISCORD_WEBHOOK_URL_ISSUEHUNT: ${{ secrets.DISCORD_WEBHOOK_URL_ISSUEHUNT }}
          ISSUEHUNT_SESSION_TOKEN: ${{ secrets.ISSUEHUNT_SESSION_TOKEN }}
        run: python -m src.issuehunt
